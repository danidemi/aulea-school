# MATERIAL — slides, Session 1
#
# SSOT store — sole writer: slide-author skill. Others read only.
# Format: .claude/reference/slide_model_spec.md
# Rules applied: .claude/reference/slide_design_rules.md
#
# Sequenced from design/curriculum.md §5 (SESSION 1). Units, minutes, Kolb stages and
# lane assignments are taken from that store, not invented here.

deck: 1
status: draft
language: it
course: "Spring Cloud Gateway per una migrazione strangler-fig su GKE"
session: 1
title: "Sessione 1 — Mettere in piedi il gateway e rendere reale lo split strangler-fig"
subtitle: "Obiettivi G1, G2 e primo passaggio su G5"

sources:
  curriculum: design/curriculum.md
  goals: specifications/goals.md
  personas: specifications/student_personas.md
  logistics: specifications/logistics.md
  read_at: 2026-07-28

budget:
  session_minutes: 240
  slide_budget: [12, 24]

# Decisioni di progettazione didattica prese qui perché la fase 3 della pipeline
# (.claude/reference/phases.md) non ha ancora un titolare. Non nascoste nel testo
# delle slide: elencate qui per il futuro instructional-designer.
instructional_decisions:
  - decision: >-
      Il tempo di slide è tenuto sotto il 40% dei minuti di ogni unità; il resto è
      laboratorio e debriefing.
    rationale: >-
      Il curriculum apre ogni unità con il compito, non con la teoria: una presentazione
      lunga invertirebbe il progetto didattico.
    confidence: inferred
    awaiting: instructional-designer
  - decision: >-
      I comandi da digitare non stanno sulle slide ma in una dispensa di laboratorio a
      parte.
    rationale: >-
      Erogazione remota su Teams con schermo condiviso e compresso: un comando letto da
      video si sbaglia. Serve un testo copiabile.
    confidence: inferred
    awaiting: instructional-designer
  - decision: >-
      Lo split in tre slide di brief (compito comune, corsia sviluppo, corsia ops) invece
      di una sola.
    rationale: >-
      Il curriculum §4 impone due corsie con ruoli reali; una slide unica finisce sempre
      per descrivere bene una corsia e male l'altra.
    confidence: inferred
    awaiting: instructional-designer

units:
  # ===================================================================== Unit 1.1
  - unit: "1.1"
    title: "Deploy di un gateway minimo su GKE"
    minutes: 105
    slides:
      - id: S1-U1.1-01
        role: vocab
        lane: both
        goals: [G1]
        provenance: stated
        headline: "Lo stesso gateway è due oggetti diversi secondo il mestiere di chi lo guarda."
        body:
          kind: diagram
          caption: "Un solo componente, due letture"
          mermaid: |
            flowchart LR
              CL[Client] --> GW[Gateway]
              GW --> NEW[Microservizi migrati]
              GW --> LEG[Applicazione legacy]
              DEV[/"corsia sviluppo:<br/>un'app Spring Boot da containerizzare"/] -.-> GW
              OPS[/"corsia ops:<br/>un carico in piu sul cluster che gia gestite"/] -.-> GW
        notes:
          talk: |
            Una frase per mestiere, dette in quest'ordine e senza approfondire: per chi
            sviluppa è un'applicazione Spring Boot containerizzata come le altre; per chi
            gestisce è un carico in più su un cluster che già amministra. Serve un
            vocabolario condiviso prima del laboratorio, altrimenti le due coppie
            useranno la stessa parola per cose diverse per tutto il giorno.
          why_here: |
            Il curriculum assegna dieci minuti di vocabolario condiviso in apertura,
            prima di qualunque attività, perché la coorte è mista e nessuno dei due
            gruppi conosce Spring Cloud Gateway.
          links: |
            Prepara il compito concreto immediatamente successivo e i due rami di corsia.
            Il ramo legacy anticipa l'unità 1.2.
          watch_for: |
            Non trasformarlo in un'introduzione all'architettura: qui non si spiega ancora
            nulla del funzionamento, si allinea solo il linguaggio.
          timing_min: 6

      - id: S1-U1.1-02
        role: problem
        lane: both
        goals: [G1]
        provenance: stated
        headline: "Finché nessuno raggiunge il gateway dall'esterno, la migrazione non è iniziata."
        body:
          kind: callout
          text: >-
            Il cluster GKE è pronto, l'immagine del gateway esiste. Nessuna richiesta
            arriva a destinazione.
        notes:
          talk: |
            Presentare la situazione come un fatto, non come esercizio didattico: è
            esattamente il punto in cui si trova il progetto in azienda. Il vincolo del
            mese di scadenza rende questo il primo blocco da rimuovere. Non anticipare
            quali sono le cause tecniche: la domanda deve restare aperta fino al debriefing.
          why_here: |
            Apre il ciclo esperienziale dell'unità con un problema riconoscibile dalla
            coorte, come richiesto dal metodo problem-first del curriculum.
          links: |
            È la ragione per cui l'obiettivo G1 viene prima di tutti gli altri: nulla di
            ciò che segue è verificabile su un gateway non raggiungibile.
          watch_for: |
            La coppia ops salta volentieri alla soluzione perché il dominio le è familiare:
            raccogliere l'ipotesi e rimandarla al debriefing invece di discuterla adesso.
          timing_min: 5

      - id: S1-U1.1-03
        role: lab-brief
        lane: both
        goals: [G1]
        provenance: stated
        headline: "Il compito è un pod del gateway raggiungibile entro il time box."
        body:
          kind: list
          ordered: false
          justification: >-
            Condizioni di completamento del laboratorio: voci parallele e indipendenti che
            vengono verificate una per una alla fine del time box, non un discorso.
          items:
            - "Immagine del gateway già disponibile"
            - "Cluster GKE vuoto e pronto"
            - "Esito atteso: risposta dall'esterno"
            - "Time box dichiarato e visibile"
        notes:
          talk: |
            Leggere la condizione di successo e far partire il timer, senza suggerire la
            strada. Il time box è parte dell'esercizio: serve a produrre un fallimento
            parziale su cui lavorare dopo, non a mettere pressione. Ricordare che i
            comandi stanno nella dispensa, non sulle slide.
          why_here: |
            Esperienza concreta: il compito precede la spiegazione del modello di deploy.
          links: |
            Gli errori che emergono qui diventano il materiale del debriefing e vengono
            ripresi uno per uno nella parte teorica.
          watch_for: |
            Verificare prima di partire che tutti abbiano accesso a gcloud e al cluster:
            il curriculum segnala questo controllo come rischio aperto, non confermato dal
            cliente. Senza accesso l'unità non ha pista di lancio.
          timing_min: 4

      - id: S1-U1.1-04
        role: lab-brief
        lane: dev
        goals: [G1]
        provenance: stated
        headline: "La corsia sviluppo lavora sull'applicazione e sulla sua immagine."
        body:
          kind: list
          ordered: true
          justification: >-
            Sequenza operativa: ogni passo presuppone il precedente, quindi l'ordine è
            parte dell'informazione e non è riducibile a un diagramma.
          items:
            - "Ispezionare l'applicazione Spring Boot"
            - "Verificare porta e endpoint di salute"
            - "Controllare il Dockerfile"
            - "Consegnare l'immagine alla corsia ops"
        notes:
          talk: |
            Assegnare i nomi ad alta voce, non lasciare che le coppie si autoassegnino:
            con quattro persone si sovrappongono sullo stesso passo. Insistere sul fatto
            che l'endpoint di salute non è un dettaglio, perché è il punto su cui si
            innesta la parte teorica successiva.
          why_here: |
            Ferma la decomposizione dove il curriculum la ferma per questa coppia: Spring
            Boot è già patrimonio dei due sviluppatori e non viene rispiegato.
          links: |
            La consegna dell'immagine è il punto di incontro con la corsia ops e prepara
            la riconvergenza.
          watch_for: |
            Rischio noia per chi si muove più veloce: chi finisce presto affianca la
            corsia ops sul cluster, non aggiunge funzionalità in autonomia.
          timing_min: 3

      - id: S1-U1.1-05
        role: lab-brief
        lane: ops
        goals: [G1]
        provenance: stated
        headline: "La corsia ops porta l'immagine sul cluster e la rende raggiungibile."
        body:
          kind: list
          ordered: true
          justification: >-
            Sequenza operativa sul cluster: ogni risorsa dipende dalla precedente, l'ordine
            è vincolante.
          items:
            - "Scrivere il Deployment"
            - "Esporre il Service"
            - "Impostare la readiness probe"
            - "Chiamare l'endpoint dall'esterno"
        notes:
          talk: |
            Qui il dominio è loro: non spiegare Kubernetes, chiedere di applicarlo. La sola
            cosa nuova è che il carico da esporre è un'applicazione Java, e la differenza
            pratica si vede sui tempi di avvio e quindi sulla probe.
          why_here: |
            La decomposizione si ferma su Docker e GKE per questa coppia: sono competenze
            già dichiarate e il curriculum vieta di rispiegarle.
          links: |
            Nessun ramo scende fino a leggere o scrivere Java per questa corsia: tutto
            resta configurazione e comportamento osservato.
          watch_for: |
            Il tempo di avvio di una JVM è più lungo di quello che questa coppia si aspetta
            da un container: è la causa più probabile di una probe che fallisce.
          timing_min: 3

      - id: S1-U1.1-06
        role: debrief
        lane: both
        goals: [G1]
        provenance: inferred
        headline: "Nella maggioranza dei casi il blocco è l'esposizione, non l'immagine."
        body:
          kind: list
          ordered: false
          justification: >-
            Domande di debriefing: vengono lette una alla volta ad alta voce e sono
            indipendenti fra loro.
          items:
            - "Cosa si è rotto per primo?"
            - "Come lo avete capito?"
            - "Chi ha visto cosa, da che punto?"
            - "Cosa cambiereste ora?"
        notes:
          talk: |
            Far parlare prima chi ha incontrato l'errore, non chi ha trovato la soluzione,
            e raccogliere le cause su una lavagna condivisa senza correggerle subito:
            servono intere come materiale per la parte teorica. Chiudere solo dopo che
            entrambe le corsie hanno confermato assieme che il gateway risponde.
          why_here: |
            La riflessione è lo stadio che viene saltato più spesso ed è quello che
            trasforma l'attività in apprendimento: il curriculum la rende esplicita.
          links: |
            È anche il momento di riconvergenza fra le due corsie previsto dal curriculum,
            in cui la coppia ops fa da mentore sul divario specifico di GKE.
          watch_for: |
            Se diventa una gara di soluzioni si perde il valore formativo: riportare le
            persone sulle cause e su come le hanno individuate.
          timing_min: 10

      - id: S1-U1.1-07
        role: concept
        lane: both
        goals: [G1]
        provenance: stated
        headline: "Una richiesta raggiunge il pod solo se Service e probe lo consentono."
        body:
          kind: diagram
          caption: "Il percorso completo di una richiesta"
          mermaid: |
            flowchart LR
              C[Client esterno] --> S[Service]
              S --> P{Readiness<br/>probe}
              P -- "pronta" --> POD[Pod gateway<br/>Spring Boot]
              P -- "non pronta" --> X[Nessun instradamento]
              POD --> A["/actuator/health/readiness"]
        notes:
          talk: |
            Percorrere il diagramma nell'ordine in cui viaggia la richiesta e fermarsi sul
            ramo negativo della probe: è lì che finiva la maggior parte degli errori
            raccolti alla lavagna pochi minuti prima. Collegare ogni nodo a un errore
            realmente visto, nominando chi lo ha incontrato: è la differenza fra una
            spiegazione e una spiegazione che risponde a qualcosa.
          why_here: |
            Concettualizzazione astratta: arriva dopo l'esperienza e spiega ciò che i
            partecipanti hanno già osservato, mai prima.
          links: |
            Chiude gli errori del debriefing; il nodo del pod è il punto in cui si innesta
            l'exporter di tracciamento della slide successiva.
          watch_for: |
            Per la corsia sviluppo il ramo "non pronta" è il meno intuitivo: dal loro punto
            di vista l'applicazione è partita, ma per il cluster non esiste ancora.
          timing_min: 10

      - id: S1-U1.1-08
        role: concept
        lane: both
        goals: [G5a]
        provenance: stated
        headline: "L'exporter OpenTelemetry di default si abilita senza scrivere codice."
        body:
          kind: code
          lang: yaml
          caption: "Configurazione, non codice: vale per entrambe le corsie"
          text: |
            management:
              tracing:
                sampling:
                  probability: 1.0
            otel:
              exporter:
                otlp:
                  endpoint: http://collector:4317
        notes:
          talk: |
            Sottolineare che questa è configurazione e non codice, perché è ciò che rende
            il tracciamento accessibile anche a chi non scrive Java. Il campionamento a uno
            serve solo in aula: in produzione va abbassato, e conviene dirlo subito per non
            lasciare in giro un'idea sbagliata.
          why_here: |
            Primo passaggio superficiale dell'obiettivo G5, che il curriculum distribuisce
            a spirale su entrambe le sessioni invece di concentrarlo in un blocco unico.
          links: |
            Il passaggio profondo arriva nell'unità 2.3, dove mancherà un salto di
            propagazione da ripristinare.
          watch_for: |
            Non aprire qui il discorso sul formato del contesto di traccia: appartiene al
            secondo passaggio e qui ruberebbe tempo al laboratorio.
          timing_min: 5

      - id: S1-U1.1-09
        role: apply
        lane: both
        goals: [G1, G5a]
        provenance: stated
        headline: "Una traccia reale della vostra richiesta compare nel collector."
        body:
          kind: placeholder
          needs: >-
            Schermata del collector o della console di osservabilità del cliente con una
            singola traccia espansa, che mostri lo span del gateway.
          why: >-
            È l'ambiente del cliente e non è recuperabile dalla rete: va catturato durante
            la preparazione della sessione, altrimenti si condivide lo schermo dal vivo.
        notes:
          talk: |
            Chiedere una previsione prima di ridistribuire: cosa cambierà nella risposta e
            cosa comparirà nel collector? Poi applicare la modifica di configurazione e
            confrontare la previsione con il risultato. È il confronto, non la modifica, a
            consolidare il principio appena spiegato.
          why_here: |
            Sperimentazione attiva sullo stesso ambiente a complessità leggermente maggiore,
            e prima osservazione diretta di una traccia da parte dei partecipanti.
          links: |
            Diventa l'esperienza concreta di apertura dell'unità 1.2: ora che qualcosa
            risponde, si può decidere dove mandare il traffico.
          watch_for: |
            Deve essere la loro richiesta e la loro traccia, non una dimostrazione del
            docente: il curriculum lo chiede esplicitamente per l'obiettivo G5.
          timing_min: 6

  # ===================================================================== Unit 1.2
  - unit: "1.2"
    title: "Instradamento strangler-fig basato sul path"
    minutes: 105
    slides:
      - id: S1-U1.2-01
        role: problem
        lane: both
        goals: [G2]
        provenance: stated
        headline: "Ora il traffico deve scegliere fra il servizio nuovo e il legacy."
        body:
          kind: diagram
          caption: "Lo split che rende reale la strangler fig"
          mermaid: |
            flowchart LR
              C[Client] --> GW[Gateway]
              GW -- "/legacy/**" --> LEG[Sistema legacy]
              GW -- "altri path" --> NEW[Microservizio migrato]
        notes:
          talk: |
            Riprendere il gateway che risponde dalla fine dell'unità precedente e mostrare
            che risponde sempre alla stessa cosa: è inutile finché non discrimina. Questa
            è la regola dichiarata dal cliente, non una scelta didattica: lo split avviene
            per path.
          why_here: |
            Apre l'unità con il compito successivo, nato dal risultato di quello precedente.
          links: |
            È il secondo passaggio della coppia deploy-instradamento che il curriculum
            tratta a spirale invece di imporre una precedenza artificiale.
          watch_for: |
            Qualcuno proporrà di dividere per header o per sottodominio: sono alternative
            legittime ma il cliente ha fissato il path, e conviene dirlo apertamente.
          timing_min: 5

      - id: S1-U1.2-02
        role: lab-brief
        lane: both
        goals: [G2]
        provenance: stated
        headline: "Il compito è mandare /legacy allo stub vecchio e il resto al nuovo."
        body:
          kind: list
          ordered: false
          justification: >-
            Condizioni di completamento verificate una per una a fine time box, non un
            discorso continuo.
          items:
            - "Due stub già distribuiti e raggiungibili"
            - "Regola attesa: /legacy/** al legacy"
            - "Ogni altro path al microservizio"
            - "Verifica dall'esterno del cluster"
        links:
          - label: "Documentazione Spring Cloud Gateway — route, predicate, filter"
            url: "https://docs.spring.io/spring-cloud-gateway/reference/"
        notes:
          talk: |
            Chiarire che gli stub esistono già: il laboratorio riguarda solo la regola di
            instradamento, non la costruzione dei servizi a valle. La verifica va fatta da
            fuori del cluster, perché è l'unico punto di vista che conta per il cliente.
          why_here: |
            Esperienza concreta dell'unità: il compito precede la formalizzazione del
            modello di instradamento.
          links: |
            Il risultato viene ripreso nella sessione 2, dove le stesse rotte vanno protette.
          watch_for: |
            Il divario di competenza è massimo qui: senza un ruolo esplicito per la corsia
            ops, i due sviluppatori prendono la tastiera e gli altri due guardano.
          timing_min: 4

      - id: S1-U1.2-03
        role: lab-brief
        lane: dev
        goals: [G2]
        provenance: stated
        headline: "La corsia sviluppo scrive predicate e filter dello split."
        body:
          kind: code
          lang: yaml
          caption: "Il punto di partenza da completare"
          text: |
            spring:
              cloud:
                gateway:
                  routes:
                    - id: legacy
                      uri: http://legacy-stub:8080
                      predicates:
                        - Path=/legacy/**
        notes:
          talk: |
            Dare il frammento incompleto e chiedere la seconda rotta, invece di mostrare la
            soluzione intera. Chiedere ad alta voce cosa accade a un path che non
            corrisponde a nessuna regola: la risposta serve al debriefing e quasi nessuno
            la indovina.
          why_here: |
            Ferma la decomposizione su Spring Boot, già patrimonio di questa coppia, e
            introduce solo ciò che è specifico del gateway.
          links: |
            Il modello formale di route, predicate e filter arriva dopo, non prima.
          watch_for: |
            L'ordine delle rotte conta e non è ovvio: è la causa più frequente di uno split
            che sembra funzionare e non funziona.
          timing_min: 3

      - id: S1-U1.2-04
        role: lab-brief
        lane: ops
        goals: [G2]
        provenance: stated
        headline: "La corsia ops verifica lo split dall'esterno e ne certifica il comportamento."
        body:
          kind: list
          ordered: true
          justification: >-
            Procedura di verifica: le chiamate vanno eseguite in questo ordine perché
            l'ultima ha senso solo dopo le prime due.
          items:
            - "Chiamare un path legacy"
            - "Chiamare un path nuovo"
            - "Chiamare un path inesistente"
            - "Riportare le tre risposte osservate"
        notes:
          talk: |
            Questo non è un compito di riserva: è la verifica indipendente dello split, e
            la terza chiamata è quella che scopre il caso limite su cui si costruisce il
            debriefing. Chiedere di riportare le risposte osservate, non le conclusioni.
          why_here: |
            Dà alla corsia ops un ruolo reale nel blocco più orientato al codice, come
            richiesto dal progetto a due corsie del curriculum.
          links: |
            Le tre risposte osservate diventano il materiale della slide di debriefing.
          watch_for: |
            Se questa coppia resta senza compito nella parte di scrittura del codice, perde
            il filo per il resto della sessione: assegnare le chiamate per nome.
          timing_min: 3

      - id: S1-U1.2-05
        role: debrief
        lane: both
        goals: [G2]
        provenance: inferred
        headline: "I casi limite dello split si vedono solo chiamandolo da fuori."
        body:
          kind: list
          ordered: false
          justification: >-
            Casi limite emersi dalla verifica, discussi uno per uno: voci parallele e
            indipendenti.
          items:
            - "Priorità fra rotte sovrapposte"
            - "Slash finale presente o assente"
            - "Path che non corrisponde a nulla"
            - "Chi risponde in caso di dubbio"
        notes:
          talk: |
            Partire dalle tre risposte riportate dalla corsia ops, non dalla
            configurazione scritta dagli sviluppatori: il comportamento osservato è il
            fatto, la configurazione è solo l'ipotesi. Poi chiedere agli sviluppatori di
            raccontare il modello di rotte in parole comprensibili all'altra coppia.
          why_here: |
            Riconvergenza e riflessione previste dal curriculum al termine del laboratorio.
          links: |
            Il caso del path non corrispondente prepara la domanda di apertura della
            sessione 2: chi è autorizzato a chiamare queste rotte?
          watch_for: |
            Far raccontare il modello a chi ha scritto la configurazione è il modo più
            rapido per scoprire se lo ha capito o solo copiato.
          timing_min: 10

      - id: S1-U1.2-06
        role: concept
        lane: both
        goals: [G2]
        provenance: stated
        headline: "Rotta, predicato e filtro sono i tre soli pezzi dello split."
        body:
          kind: diagram
          caption: "Come il gateway decide e poi trasforma"
          mermaid: |
            flowchart TB
              REQ[Richiesta in ingresso] --> M{Predicato<br/>corrisponde?}
              M -- "no" --> NEXT[Rotta successiva]
              M -- "sì" --> F[Catena di filtri]
              F --> URI[URI di destinazione]
              NEXT --> NONE[Nessuna rotta: 404]
        notes:
          talk: |
            Tre parole e non più di tre: il predicato decide, il filtro trasforma, l'URI
            indirizza. Percorrere il ramo negativo fino al 404, perché è il caso limite
            appena osservato dalla corsia ops. Il ciclo sulle rotte spiega da solo perché
            l'ordine conta.
          why_here: |
            Formalizza il modello dopo che i partecipanti ne hanno visto il comportamento,
            e dà il nome alla regola dichiarata dal cliente.
          links: |
            La catena di filtri è il punto in cui la sessione 2 inserirà la validazione del
            token e la generazione del token verso il legacy.
          watch_for: |
            La catena di filtri va accennata e non sviluppata: è il gancio della sessione 2
            e qui aprirla ruberebbe tempo all'ultima esperienza attiva.
          timing_min: 10

      - id: S1-U1.2-07
        role: apply
        lane: both
        goals: [G2]
        provenance: stated
        headline: "Una seconda famiglia di path mette alla prova la regola appena capita."
        body:
          kind: callout
          text: >-
            Estendere l'instradamento a una seconda famiglia di path, decidendo dove
            collocarla rispetto alle rotte esistenti.
        notes:
          talk: |
            Chiedere prima dove va messa la nuova rotta e perché, poi farla scrivere: la
            decisione sull'ordine è l'apprendimento, la scrittura è meccanica. Chi sbaglia
            l'ordine ottiene un errore osservabile, ed è il risultato migliore possibile.
          why_here: |
            Sperimentazione attiva su un problema strutturalmente simile ma nuovo, che
            diventa l'esperienza concreta di apertura della sessione successiva.
          links: |
            Confluisce direttamente nel menu opzionale e apre la sessione 2.
          watch_for: |
            Se il tempo stringe, questa è l'ultima cosa da comprimere prima di toccare il
            menu opzionale: gli obiettivi G1, G2 e G5a non si tagliano mai.
          timing_min: 6

      - id: S1-U1.2-08
        role: menu
        lane: both
        goals: [G2]
        provenance: stated
        headline: "Scegliete un approfondimento fra tre, se il tempo lo consente."
        body:
          kind: list
          ordered: false
          justification: >-
            Menu di alternative fra cui la classe sceglie: per definizione un elenco di
            voci mutuamente alternative.
          items:
            - "Instradamento a pesi e canary"
            - "Ingress GKE contro Gateway API"
            - "Filtri di riscrittura del path"
        notes:
          talk: |
            Presentare le tre voci e far scegliere alla classe, non scegliere al posto loro:
            la voce sui pesi è pensata per chi si annoia, quella su Ingress per la corsia
            ops. Se la sessione è in ritardo questo è il primo blocco a cadere, e va detto
            senza girarci intorno.
          why_here: |
            Autonomia calibrata: il curriculum prevede un menu stretto e non ampio, per non
            lasciare senza percorso definito chi preferisce una traccia strutturata.
          links: |
            È anche la valvola di sfogo temporale dichiarata della sessione.
          watch_for: |
            Se cade, riprenderlo come accenno narrato di cinque minuti invece di eliminarlo
            del tutto: resta il segnale che esistono alternative.
          timing_min: 4

      - id: S1-U1.2-09
        role: homework
        lane: both
        goals: [G3, G5b]
        provenance: stated
        headline: "Nella settimana che separa le due sessioni ogni corsia prepara la propria."
        body:
          kind: list
          ordered: false
          justification: >-
            Due compiti distinti assegnati a due gruppi distinti: elenco di assegnazioni,
            non un testo continuo.
          items:
            - "Sviluppo: struttura di un token Entra ID"
            - "Sviluppo: endpoint JWKS, a cosa serve"
            - "Ops: collector ancora raggiungibile"
        notes:
          talk: |
            Dire quanto costa davvero, meno di un'ora, perché il margine di tempo
            extra-aula di questa coorte è stretto e un compito che sembra grande non viene
            fatto. Spiegare a cosa serve: senza la scorsa sul token, il blocco di
            validazione della sessione 2 rischia di sforare.
          why_here: |
            La settimana di intervallo rende praticabile il lavoro fra le sessioni, e il
            curriculum lo prevede esplicitamente.
          links: |
            Alimenta direttamente l'unità 2.1 e la verifica del tracciamento dell'unità 2.3.
          watch_for: |
            Il curriculum segnala come rischio aperto che la familiarità con Entra ID sia
            più bassa del previsto anche fra gli sviluppatori: questo compito è la
            mitigazione, non un extra.
          timing_min: 4
