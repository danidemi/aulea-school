services:
  # E2E-BROWSER-001: a disposable Postgres for the Playwright suite, kept
  # separate from server/docker-compose.yml's own stack (different
  # project name via `-p`, different host port) so a developer's
  # long-running dev stack is never touched or collided with. No named
  # volume — this data is never meant to survive a run.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aulea_platform
      POSTGRES_PASSWORD: aulea_platform
      POSTGRES_DB: aulea_platform
    ports:
      - '${E2E_DB_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aulea_platform']
      interval: 2s
      timeout: 2s
      retries: 30

  # RESEND-CONFIRMATION-001: the fake mailer for the e2e stack. Real sign up and
  # resend send mail; Mailpit captures it and its HTTP API lets a spec read the
  # confirmation links. Own host ports, so a developer's Mailpit is not touched.
  mailpit:
    image: axllent/mailpit
    ports:
      - '${E2E_SMTP_PORT:-1026}:1025'
      - '${E2E_MAIL_API_PORT:-8026}:8025'
