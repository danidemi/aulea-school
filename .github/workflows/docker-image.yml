name: Build and push Docker image

# Runs on tags like v12, v45, v261113 (v + digits only).
on:
  push:
    tags:
      - 'v[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and build metadata
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/aulea:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "ts=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: aulea-platform
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            GIT_BRANCH=${{ github.ref_name }}
            GIT_COMMIT_SHA=${{ steps.meta.outputs.sha }}
            GIT_COMMIT_TIMESTAMP=${{ steps.meta.outputs.ts }}
            GIT_DIRTY=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
