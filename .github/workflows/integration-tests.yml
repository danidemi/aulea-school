name: Integration tests

# TEST-INTEGRATION-001 / ADR-0014: repository tests on a real Postgres started by
# testcontainers. Docker is preinstalled on ubuntu-latest.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aulea-platform/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aulea-platform/server/package-lock.json

      - run: npm ci

      - run: npm run test:integration
